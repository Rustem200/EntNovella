name: Unity activation

# Разовый workflow: получает файл .alf для ручной активации Unity Personal.
# Actions -> Unity activation -> Run workflow, потом скачать артефакт.
on:
  workflow_dispatch:

jobs:
  activation:
    name: Получить .alf
    runs-on: ubuntu-latest
    steps:
      - name: Запросить файл активации
        id: request
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.12f1

      - name: Выложить .alf артефактом
        uses: actions/upload-artifact@v4
        with:
          name: Unity-activation-file
          path: ${{ steps.request.outputs.filePath }}
