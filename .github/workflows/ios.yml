name: iOS

# Запуск вручную: вкладка Actions -> iOS -> Run workflow.
# Нужны секреты UNITY_USERNAME (почта аккаунта Unity) и UNITY_PASSWORD.
on:
  workflow_dispatch:

jobs:
  build:
    name: Собрать .ipa
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Поставить Unity с модулем iOS
        uses: RageAgainstThePixel/unity-setup@v1
        with:
          build-targets: iOS

      - name: Активировать лицензию Personal
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Unity -> Xcode-проект
        run: |
          "$UNITY_EDITOR_PATH" \
            -quit -batchmode -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -buildTarget iOS \
            -executeMethod CIBuild.BuildIOS \
            -logFile -

      - name: Xcode -> архив без подписи
        run: |
          cd build/iOS
          xcodebuild \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/app.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Упаковать .ipa
        run: |
          cd build/iOS
          mkdir -p Payload
          cp -R app.xcarchive/Products/Applications/*.app Payload/
          zip -qry EntNovella.ipa Payload

      - name: Выложить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: EntNovella-ipa
          path: build/iOS/EntNovella.ipa
          retention-days: 30
