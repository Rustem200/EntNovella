name: iOS

# Запуск вручную: вкладка Actions -> iOS -> Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    name: Собрать .ipa
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Кэш Library (ускоряет повторные сборки)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-

      - name: Unity -> Xcode-проект
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 6000.3.12f1
          targetPlatform: iOS
          allowDirtyBuild: true

      - name: Xcode -> архив без подписи
        run: |
          cd build/iOS/iOS
          xcodebuild \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/app.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Упаковать .ipa
        run: |
          cd build/iOS/iOS
          mkdir -p Payload
          cp -R app.xcarchive/Products/Applications/*.app Payload/
          zip -qry EntNovella.ipa Payload

      - name: Выложить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: EntNovella-ipa
          path: build/iOS/iOS/EntNovella.ipa
          retention-days: 30
